spring:
  application:
    name: sgf-backend

  docker:
    compose:
      enabled: false   # evita erro quando o docker-compose.yml não está no working directory do IntelliJ

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:sgf_db}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        id.new_generator_mappings: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    out-of-order: false

server:
  port: ${APP_PORT:8080}

# ── JWT ────────────────────────────────────────────────────────────────────────
# Em produção: sobrescreva sgf.jwt.secret com uma variável de ambiente segura
# de no mínimo 32 caracteres. Nunca commite o valor real no repositório.
sgf:
  jwt:
    secret: ${JWT_SECRET:sgf-default-dev-secret-change-in-production-min32chars}
    expiracao-ms: ${JWT_EXPIRACAO_MS:86400000}  # 24h
  cors:
    # CORREÇÃO v6: origens CORS restritas por variável de ambiente.
    # Em produção: CORS_ALLOWED_ORIGINS=https://sgf.prefeitura.gov.br
    # Em dev: valor padrão permite apenas o Vite local.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

logging:
  level:
    br.leetjourney.sgf_backend: DEBUG
    org.springframework.web: INFO
    org.flywaydb: INFO
